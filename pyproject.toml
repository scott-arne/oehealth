[build-system]
requires = ["scikit-build-core>=0.8", "swig>=4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "oehealth"
version = "0.1.0"
description = "High performance assessment of molecule health"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Scott Johnson", email = "scott.johnson@bms.com" },
]
keywords = ["chemistry", "openeye", "swig"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
]
dependencies = [
    "openeye-toolkits>=2026.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "vrzn>=0.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
addopts = "-v"
# SWIG-generated modules trigger these on import under Python 3.12+; they are
# not from this project's code. Only these three messages are ignored.
filterwarnings = [
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.scikit-build]
cmake.version = ">=3.21"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
build.targets = ["oehealth_python"]
wheel.install-dir = "."
logging.level = "INFO"
strict-config = false
wheel.py-api = "cp312"
wheel.exclude = ["**.pyc", "**/__pycache__", "*.a", "CMakeFiles/**"]

[tool.scikit-build.cmake.define]
OEHEALTH_BUILD_TESTS = "OFF"
OEHEALTH_BUILD_PYTHON = "ON"
OPENEYE_USE_SHARED = "ON"
OEHEALTH_USE_STABLE_ABI = "ON"
OEHEALTH_UNIVERSAL2 = "OFF"

# =============================================================================
# TOML-driven build configuration for scripts/build_python.py
# =============================================================================
# This section is read by build_python.py to parameterize the build.
# The script itself is identical across all projects — only this config changes.
[tool.oe-build]
package-name = "oehealth"
cmake-test-flag = "OEHEALTH_BUILD_TESTS"
rpath-strategy = "platform"  # "platform" = @loader_path/../openeye/libs/{platform}, "simple" = @loader_path

# OpenEye libraries that are expected to be missing from delocate
# (they are provided at runtime by openeye-toolkits, not bundled in the wheel)
expected-missing-libs = [
    "liboechem", "liboesystem", "liboeplatform",
    "liboemath", "libzstd", "liboebio", "liboegrid", "liboefizzchem",
]

# Additional CMake defines passed during wheel build (beyond the standard ones)
[tool.oe-build.extra-cmake-defines]

# =============================================================================
# Pyright / Pylance configuration (type checking and editor analysis)
# https://microsoft.github.io/pyright/#/configuration
# =============================================================================
# Restrict analysis to this project's Python source so Pylance does not crawl
# build artifacts, SWIG-generated output, or the interpreter's site-packages.
[tool.pyright]
include = ["python", "tests/python"]
exclude = [
    "**/__pycache__",
    "**/.*",
    "build",
    "build-*",
    "dist",
    "**/*.egg-info",
]


# =============================================================================
# Ruff (lint) and mypy (type check)
# =============================================================================
# Both cover the package, the reference-table generator, and the Python tests.
# The SWIG-generated module, the generated build info, and the shared
# scripts/build_python.py are excluded.
[tool.ruff]
line-length = 100
target-version = "py312"
include = [
    "python/oehealth/**/*.py",
    "scripts/generate_engh_huber.py",
    "tests/python/**/*.py",
]
extend-exclude = [
    "python/oehealth/oehealth.py",
    "python/oehealth/_build_info.py",
    "scripts/build_python.py",
]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["oehealth"]

[tool.ruff.lint.per-file-ignores]
# The extension import must follow the runtime-library setup calls, and the
# template's warnings keep their default stack level.
"python/oehealth/__init__.py" = ["E402", "B028"]

[tool.mypy]
python_version = "3.12"
mypy_path = "python"
files = ["python/oehealth", "scripts/generate_engh_huber.py", "tests/python"]
exclude = ['^python/oehealth/oehealth\.py$', '^python/oehealth/_build_info\.py$']
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["oehealth.oehealth", "oehealth._build_info", "openeye", "openeye.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["generate_engh_huber", "test_generate_engh_huber"]
disallow_untyped_defs = true
